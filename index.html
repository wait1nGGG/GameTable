<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗地主</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   设计令牌
   配色取自「Card & Board Game」组合：毡面绿 + 金，深色底
   质感走轻拟物：木质外框、绒面毡桌、多层阴影、按压缩放
   ============================================================ */
:root {
  /* 牌桌：受光中心 -> 四周暗角 */
  --felt-lit:  #1a8f52;
  --felt:      #15803d;
  --felt-mid:  #106234;
  --felt-edge: #0a3d22;
  --felt-deep: #072a17;

  /* 木质外框 */
  --wood-lit:  #8a5a2e;
  --wood:      #6b4423;
  --wood-dark: #3f2614;

  /* 面板 / HUD */
  --panel:     rgba(17, 23, 38, .93);
  --panel-2:   rgba(28, 36, 55, .96);
  --sunken:    rgba(0, 0, 0, .34);
  --line:      rgba(255, 255, 255, .10);
  --line-2:    rgba(255, 255, 255, .17);

  /* 文字 */
  --fg:        #f1f5f9;
  --fg-dim:    #cbd5e1;
  --fg-muted:  #94a3b8;

  /* 强调 */
  --gold:      #d97706;
  --gold-lit:  #f0a83c;
  --on-gold:   #1a1206;
  --jade:      #22a05a;
  --jade-dark: #15803d;
  --danger:    #dc2626;
  --danger-lit:#f87171;

  /* 牌面 */
  --cream:     #fbf7ec;
  --cream-2:   #efe7d4;
  --ink:       #1c1917;
  --red:       #c0392b;

  --sans:  "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --serif: "Noto Serif SC", "Songti SC", serif;
  --mono:  "Roboto Mono", ui-monospace, monospace;

  --rail: 22px;
  --hud-clear: 108px;  /* 底部 HUD 高度 + 间距（玩法切换 + 难度两排），手牌/棋盘让开这么多 */
  --r-sm: 8px;  --r-md: 12px;  --r-lg: 16px;  --r-pill: 999px;
  --t-fast: .15s;  --t: .22s;
  --shadow-hud: 0 6px 22px rgba(0, 0, 0, .5);
  --icon: 17px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
body {
  font-family: var(--sans);
  background: var(--felt-deep);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select:none; user-select:none;
}

/* ============================================================
   牌桌
   #game-container 铺木纹；::before 把中间"挖"成毡面；
   ::after 叠一层绒面颗粒与中央暗纹（不遮挡任何内容，均为 z-index:0）
   ============================================================ */
#game-container {
  position:relative; width:100%; height:100%; overflow:hidden;
  /* 木框：自上而下受光，四条边才有一致的明暗；细纹是木纹 */
  background:
    repeating-linear-gradient(97deg, rgba(0,0,0,.22) 0 2px, transparent 2px 9px),
    linear-gradient(180deg,
      var(--wood-lit) 0%, var(--wood) 9%, var(--wood-dark) 52%,
      var(--wood) 90%, var(--wood-lit) 100%);
}
#game-container::before {
  content:''; position:absolute; inset:var(--rail); z-index:0; pointer-events:none;
  border-radius:10px;
  background: radial-gradient(125% 98% at 50% 30%,
    var(--felt-lit) 0%, var(--felt) 22%, var(--felt-mid) 50%,
    var(--felt-edge) 78%, var(--felt-deep) 100%);
  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,.42),          /* 毡面与木框交界的压边 */
    inset 0 0 120px 40px rgba(0,0,0,.5),      /* 四周暗角，把视线收进桌面 */
    0 0 0 1px rgba(255,255,255,.10);          /* 木框内侧高光 */
}
#game-container::after {
  content:''; position:absolute; inset:var(--rail); z-index:0; pointer-events:none;
  border-radius:10px;
  background:
    radial-gradient(circle at 50% 46%, transparent 147px, rgba(255,255,255,.05) 148px, rgba(255,255,255,.05) 149px, transparent 150px),
    repeating-linear-gradient(133deg, rgba(255,255,255,.017) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(45deg,  rgba(0,0,0,.022) 0 1px, transparent 1px 4px);
  mix-blend-mode: overlay;
}

/* ============================================================
   通用按钮系统
   ============================================================ */
button {
  font-family: var(--sans); font-weight:700; letter-spacing:.04em;
  border:none; cursor:pointer; white-space:nowrap;
  transition: transform var(--t-fast) ease, box-shadow var(--t) ease,
              filter var(--t) ease, background var(--t-fast) ease, color var(--t-fast) ease;
}
button:active:not(:disabled) { transform: translateY(1px) scale(.985); }
button:disabled { opacity:.34; cursor:not-allowed; filter:saturate(.35); transform:none; }
button:focus-visible { outline:2px solid #fff; outline-offset:2px; }

.btn-play, .btn-pass, .btn-hint, .btn-bid, .btn-no-bid {
  min-height:44px; padding:0 30px; border-radius:var(--r-pill); font-size:16px;
}
.btn-play {
  background:linear-gradient(180deg, var(--gold-lit), var(--gold)); color:var(--on-gold);
  box-shadow:0 4px 14px rgba(217,119,6,.42), inset 0 1px 0 rgba(255,255,255,.45);
}
.btn-play:hover:not(:disabled) { box-shadow:0 7px 20px rgba(217,119,6,.55), inset 0 1px 0 rgba(255,255,255,.45); }
.btn-hint {
  background:linear-gradient(180deg, var(--jade), var(--jade-dark)); color:#04240f;
  box-shadow:0 4px 14px rgba(34,160,90,.38), inset 0 1px 0 rgba(255,255,255,.35);
}
.btn-hint:hover:not(:disabled) { box-shadow:0 7px 20px rgba(34,160,90,.5), inset 0 1px 0 rgba(255,255,255,.35); }
.btn-pass, .btn-no-bid {
  background:rgba(255,255,255,.10); color:var(--fg);
  border:1px solid var(--line-2);
  box-shadow:0 3px 12px rgba(0,0,0,.3);
}
.btn-pass:hover:not(:disabled), .btn-no-bid:hover:not(:disabled) { background:rgba(255,255,255,.19); }
.btn-bid {
  background:linear-gradient(180deg, var(--gold-lit), var(--gold)); color:var(--on-gold);
  box-shadow:0 4px 14px rgba(217,119,6,.42), inset 0 1px 0 rgba(255,255,255,.45);
}
/* 结算/猜拳/手心手背用的大按钮 */
.btn-palm, .btn-rps {
  min-height:60px; padding:0 26px; font-size:28px; border-radius:var(--r-lg);
  background:rgba(255,255,255,.12); border:1px solid var(--line-2); color:var(--fg);
  box-shadow:0 4px 16px rgba(0,0,0,.35);
}
.btn-palm:hover, .btn-rps:hover { background:rgba(255,255,255,.22); }

/* ============================================================
   HUD 底栏（难度 + 查看手牌 + 重新开始）
   合成一块面板浮在手牌之上：底色不透明，压住牌面也能看清
   ============================================================ */
#bottom-bar {
  position:absolute; z-index:6;
  bottom:14px; left:calc(var(--rail) + 10px);
  display:flex; flex-direction:column; align-items:stretch; gap:5px;
  padding:5px; border-radius:var(--r-lg);
  background:var(--panel); border:1px solid var(--line);
  box-shadow:var(--shadow-hud);
}
#hud-row { display:flex; align-items:center; gap:4px; }

/* 玩法切换：和难度同为分段控件，但用玉色区分「换玩法」与「换难度」 */
#game-select {
  display:flex; gap:3px; padding:3px;
  background:var(--sunken); border:1px solid var(--line); border-radius:12px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
}
.game-btn {
  flex:1; min-height:32px; padding:0 15px; font-size:13.5px; letter-spacing:.03em;
  color:var(--fg-muted); background:transparent; border-radius:9px;
}
.game-btn:hover { background:rgba(255,255,255,.09); color:var(--fg); }
.game-btn[aria-pressed="true"] {
  background:linear-gradient(180deg, var(--jade), var(--jade-dark));
  color:#04240f;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 2px 6px rgba(0,0,0,.45);
}
.game-btn[aria-pressed="true"]:hover { color:#04240f; }
.btn-hud {
  display:inline-flex; align-items:center; gap:7px;
  min-height:40px; padding:0 14px;
  font-size:14px; color:var(--fg-dim);
  background:transparent; border:1px solid transparent; border-radius:10px;
}
.btn-hud:hover { background:rgba(255,255,255,.09); color:#fff; }
.btn-hud svg { width:var(--icon); height:var(--icon); flex:none; }
.hud-sep { width:1px; height:22px; background:var(--line); margin:0 4px; flex:none; }

/* 难度：分段控件（凹陷轨道 + 抬起的高亮档位） */
#difficulty {
  display:flex; gap:3px; padding:3px;
  background:var(--sunken); border:1px solid var(--line); border-radius:12px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
}
.btn-diff {
  min-height:32px; padding:0 15px; font-size:13.5px; letter-spacing:.03em;
  color:var(--fg-muted); background:transparent; border-radius:9px;
}
.btn-diff:hover { background:rgba(255,255,255,.09); color:var(--fg); }
/* 选中态同时是语义态：aria-pressed 驱动样式，避免颜色成为唯一指示 */
.btn-diff[aria-pressed="true"] {
  background:linear-gradient(180deg, var(--gold-lit), var(--gold));
  color:var(--on-gold);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 2px 6px rgba(0,0,0,.45);
}
.btn-diff[aria-pressed="true"]:hover { color:var(--on-gold); }

/* ============================================================
   右下工具区（OP / 记牌器）
   ============================================================ */
#toolbox {
  position:absolute; z-index:6;
  bottom:14px; right:calc(var(--rail) + 10px);
  display:flex; align-items:center; gap:4px;
  padding:5px; border-radius:var(--r-lg);
  background:var(--panel); border:1px solid var(--line);
  box-shadow:var(--shadow-hud);
}
#op-wrap, #counter-wrap { position:relative; display:flex; }
#op-toggle, #counter-toggle {
  display:inline-flex; align-items:center; gap:7px;
  min-height:40px; padding:0 15px;
  font-size:14px; color:var(--fg-dim);
  background:transparent; border:1px solid transparent; border-radius:10px;
}
#op-toggle:hover, #counter-toggle:hover { background:rgba(255,255,255,.09); color:#fff; }
#counter-toggle[aria-expanded="true"] { background:var(--gold); color:var(--on-gold); }
#op-toggle[aria-expanded="true"] { background:rgba(255,255,255,.16); color:#fff; }
#op-toggle svg, #counter-toggle svg { width:var(--icon); height:var(--icon); flex:none; }

/* 弹出面板 */
#op-panel, #counter-panel {
  position:absolute; bottom:calc(100% + 12px); right:0;
  background:var(--panel-2); border:1px solid var(--line-2);
  border-radius:var(--r-md);
  box-shadow:0 12px 34px rgba(0,0,0,.55);
  padding:10px;
  transform-origin:bottom right;
  transition: transform var(--t) ease, opacity var(--t) ease;
}
#op-panel { width:196px; display:flex; flex-direction:column; gap:6px; }
#counter-panel { width:200px; padding:12px 14px 14px; }
#op-panel.op-closed, #counter-panel.counter-closed {
  transform:scale(.94) translateY(10px); opacity:0; pointer-events:none;
}
.op-btn {
  display:flex; align-items:center; gap:9px;
  min-height:40px; padding:0 12px;
  font-size:14px; color:var(--fg-dim); text-align:left;
  background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:9px;
}
.op-btn:hover { background:rgba(240,168,60,.20); color:#fff; border-color:rgba(240,168,60,.4); }
.op-btn svg { width:16px; height:16px; flex:none; opacity:.85; }
.op-btn[data-accent="danger"]:hover { background:rgba(220,38,38,.24); border-color:rgba(220,38,38,.5); }

/* 记牌器 */
.counter-head {
  display:flex; align-items:center; justify-content:center; gap:7px;
  font-size:14px; font-weight:700; color:var(--gold-lit);
  letter-spacing:.08em; margin-bottom:10px; padding-bottom:9px;
  border-bottom:1px solid rgba(240,168,60,.22);
}
.counter-head svg { width:15px; height:15px; }
.counter-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
.counter-cell {
  display:flex; flex-direction:column; align-items:center;
  padding:5px 2px 4px; border-radius:6px;
  background:rgba(255,255,255,.05); border:1px solid var(--line);
  font-family:var(--mono);
}
.counter-cell .c-rank { font-family:var(--sans); font-size:12px; font-weight:700; color:var(--fg-dim); }
.counter-cell .c-out  { font-size:15px; font-weight:700; color:#fff; margin-top:2px; }
/* 出完的牌：不只靠变淡，同时降低字重，避免只以颜色区分 */
.counter-cell.dim .c-rank, .counter-cell.dim .c-out { color:rgba(255,255,255,.26); font-weight:500; }
.counter-cell.bomb { background:rgba(220,38,38,.26); border-color:rgba(220,38,38,.55); }
.counter-cell.bomb .c-rank, .counter-cell.bomb .c-out { color:#fca5a5; }

/* ============================================================
   座位（AI）
   ============================================================ */
.seat { position:absolute; z-index:3; display:flex; flex-direction:column; align-items:center; gap:8px; }
#player-1-area { top:4.5%; left:3.5%; }
#player-2-area { top:4.5%; right:3.5%; }

.player-label {
  font-size:13.5px; font-weight:700; letter-spacing:.05em;
  padding:5px 16px; border-radius:var(--r-pill);
  background:var(--panel); color:var(--fg-dim);
  border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.35);
  white-space:nowrap;
  transition: box-shadow var(--t) ease, background var(--t) ease;
}
.player-label.landlord { background:linear-gradient(180deg, var(--gold-lit), var(--gold)); color:var(--on-gold); border-color:rgba(0,0,0,.3); }
.player-label.farmer   { background:linear-gradient(180deg, var(--jade), var(--jade-dark)); color:#04240f; border-color:rgba(0,0,0,.3); }
.player-label.active   { box-shadow:0 0 0 2px rgba(255,255,255,.92), 0 0 18px 5px rgba(240,168,60,.5); }

.player-cards { display:flex; flex-wrap:nowrap; justify-content:center; min-height:52px; }
.card-count {
  font-family:var(--mono); font-size:12px; color:var(--fg-dim);
  background:var(--panel); padding:3px 11px; border-radius:var(--r-pill);
  border:1px solid var(--line);
}

.play-area-ai {
  display:flex; justify-content:center; align-items:flex-end;
  min-height:110px; margin-top:8px; width:180px;
}

/* ============================================================
   中央出牌区 + 玩家手牌
   ============================================================ */
#player-zone {
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  z-index:4;
  /* 抬到左右两组 HUD 之上，避免最左边几张手牌被底栏压住 */
  padding-bottom: var(--hud-clear);
}
.play-area-human { display:flex; justify-content:center; align-items:flex-end; min-height:100px; margin-top:4px; }

#status-text {
  font-family:var(--serif); font-size:16px; font-weight:800; color:var(--gold-lit);
  min-height:32px; line-height:32px; white-space:nowrap; letter-spacing:.03em;
  padding:0 20px; border-radius:var(--r-pill);
  background:rgba(7,42,23,.72); border:1px solid rgba(240,168,60,.20);
  text-shadow:0 1px 4px rgba(0,0,0,.6);
}
#action-row { display:flex; gap:12px; min-height:48px; align-items:center; }

/* 底牌 */
#bottom-cards-area {
  position:absolute; top:19%; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:2;
  transition: top .6s ease, transform .6s ease, opacity .6s ease;
}
#bottom-cards-area .card { cursor:default; }
#bottom-cards-area.moved-up { top:4.5%; transform:translateX(-50%) scale(.68); opacity:.85; }

#cards-0 { display:flex; flex-wrap:nowrap; justify-content:center; padding:4px 80px 0; min-height:118px; }
#cards-0 .card { margin-left:-30px; }
#cards-0 .card:first-child { margin-left:0; }

/* ============================================================
   纸牌
   ============================================================ */
.card {
  width:74px; height:106px; border-radius:9px; position:relative;
  cursor:pointer; flex-shrink:0; font-family:var(--serif);
  background:linear-gradient(158deg, var(--cream) 0%, var(--cream-2) 100%);
  border:1px solid #cdbfa0;
  box-shadow:0 3px 8px rgba(0,0,0,.34), inset 0 0 0 1px rgba(255,255,255,.6);
  transition: transform var(--t-fast) ease, box-shadow var(--t-fast) ease, border-color var(--t-fast) ease;
  display:inline-flex; align-items:center; justify-content:center;
}
.card.black { color:var(--ink); }
.card.red   { color:var(--red); }
.card::after {
  content:''; position:absolute; inset:3px; border-radius:6px;
  border:1px solid rgba(120,104,70,.16); pointer-events:none;
}
.card:hover { transform:translateY(-4px); }
.card.selected {
  transform:translateY(-24px);
  border-color:var(--gold-lit);
  box-shadow:0 12px 22px rgba(0,0,0,.45), 0 0 0 2px var(--gold-lit), 0 0 16px rgba(240,168,60,.45);
}
/* 牌背：交叉网纹比单向斜纹更像真牌 */
.card.face-down {
  background:linear-gradient(150deg, #2a3550, #151c2e);
  border-color:#0b1120; cursor:default;
  box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.10);
}
.card.face-down:hover { transform:none; }
.card.face-down::after { border-color:rgba(255,255,255,.13); }
.card.face-down::before {
  content:''; position:absolute; inset:4px; border-radius:6px;
  background:
    repeating-linear-gradient(45deg,  transparent 0 5px, rgba(255,255,255,.055) 5px 10px),
    repeating-linear-gradient(-45deg, transparent 0 5px, rgba(255,255,255,.055) 5px 10px);
}

.card .corner, .card .corner-bot {
  position:absolute; display:flex; flex-direction:column; align-items:center;
  line-height:1.0; font-weight:800;
}
.card .corner { top:7px; left:9px; }
.card .corner-bot { bottom:7px; right:9px; transform:rotate(180deg); }
.card .corner .cr { font-size:26px; }
.card .corner .cs { font-size:23px; margin-top:-1px; }
.card.joker .corner .cr, .card.joker .corner-bot .cr { font-size:15px; }
.card.joker .corner .cs, .card.joker .corner-bot .cs { font-size:14px; }

/* AI 手牌：缩小一号 */
.ai-card-area .card { width:46px; height:66px; border-radius:6px; }
.ai-card-area .card + .card { margin-left:-20px; }
.ai-card-area .card .corner { top:4px; left:5px; }
.ai-card-area .card .corner-bot { bottom:4px; right:5px; }
.ai-card-area .card .corner .cr { font-size:16px; }
.ai-card-area .card .corner .cs { font-size:14px; }
.ai-card-area .card.joker .corner .cr { font-size:10px; }
.ai-card-area .card.joker .corner .cs { font-size:9px; }

/* 出牌 / 压牌动画 */
.play-area-human .card + .card { margin-left:-34px; }
.play-area-ai .card { width:56px; height:78px; }
.play-area-ai .card + .card { margin-left:-26px; }
.play-area-human .card.slapped, .play-area-ai .card.slapped { animation:slap .35s ease-out both; }
@keyframes slap { from { transform:scale(1.45); opacity:.25; } to { transform:scale(1); opacity:1; } }

.pass-tag {
  font-size:13.5px; font-weight:700; color:var(--fg-muted);
  padding:5px 14px; border-radius:var(--r-pill);
  background:rgba(0,0,0,.42); border:1px solid var(--line);
  align-self:center;
}

/* ============================================================
   Overlay（抢地主 / 手心手背 / 猜拳 / 结算）
   ============================================================ */
#overlay, #win-overlay {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:18px;
  background:rgba(4,10,7,.84);   /* 遮罩按实际底色取值，保证前景可读 */
}
#overlay { z-index:20; }
#win-overlay { z-index:21; gap:22px; background:rgba(3,8,6,.88); }
.win-actions { display:flex; gap:14px; align-items:center; }
#overlay.hidden, #win-overlay.hidden { display:none; }

#overlay-title {
  font-family:var(--serif); font-size:30px; font-weight:800;
  color:var(--gold-lit); letter-spacing:.06em; text-shadow:0 2px 10px rgba(0,0,0,.7);
}
#overlay-info { color:var(--fg-dim); font-size:15px; min-height:24px; }
#overlay-content { display:flex; gap:44px; align-items:center; }
.overlay-player { text-align:center; }
.overlay-player .name { font-size:14px; color:var(--fg-dim); margin-bottom:9px; }
.overlay-player .choice {
  font-size:54px; width:96px; height:96px; line-height:96px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.07); border-radius:20px; border:1px solid var(--line-2);
}
.overlay-player .choice.winner {
  background:rgba(240,168,60,.24); border-color:var(--gold-lit);
  box-shadow:0 0 24px rgba(240,168,60,.5);
}
.overlay-player .choice.eliminated { opacity:.3; }
#overlay-buttons { display:flex; gap:14px; margin-top:6px; }

#win-text { font-family:var(--serif); font-size:42px; font-weight:800; letter-spacing:.05em; }
#win-text.win  { color:var(--gold-lit); text-shadow:0 3px 16px rgba(240,168,60,.5); }
#win-text.lose { color:#8fa0a8; }

/* ============================================================
   特殊牌型动效
   ============================================================ */
#fx-flash {
  position:absolute; inset:0; pointer-events:none; z-index:19; opacity:0;
  background:radial-gradient(circle at 50% 45%, rgba(255,140,60,.42), transparent 62%);
}
#fx-flash.fx-bomb   { background:radial-gradient(circle at 50% 45%, rgba(255,120,50,.45), transparent 62%); }
#fx-flash.fx-rocket { background:radial-gradient(circle at 50% 45%, rgba(255,210,90,.55), transparent 62%); }
#fx-flash.fx-plane  { background:radial-gradient(circle at 50% 45%, rgba(90,200,220,.35), transparent 62%); }
#fx-flash.fx-on { animation:fx-pulse .55s ease-out both; }
@keyframes fx-pulse { 0%{opacity:0;} 22%{opacity:1;} 100%{opacity:0;} }

@keyframes fx-shake {
  10%,90% { transform:translate(-2px,2px); } 20%,80% { transform:translate(4px,-2px); }
  30%,50%,70% { transform:translate(-5px,3px); } 40%,60% { transform:translate(5px,-3px); }
}
@keyframes fx-shake-strong {
  10%,90% { transform:translate(-3px,3px); } 20%,80% { transform:translate(6px,-3px); }
  30%,70% { transform:translate(-8px,4px); } 40%,60% { transform:translate(8px,-4px); }
  50% { transform:translate(-5px,0); }
}
#game-container.fx-bomb   { animation:fx-shake .5s linear both; }
#game-container.fx-rocket { animation:fx-shake-strong .55s linear both; }

.shaking { animation:shake .15s ease-in-out infinite; }
@keyframes shake { 0%,100%{transform:rotate(-13deg);} 50%{transform:rotate(13deg);} }
.pop-in { animation:pop .3s ease-out; }
@keyframes pop { 0%{transform:scale(0);} 80%{transform:scale(1.1);} 100%{transform:scale(1);} }

/* ============================================================
   中国象棋：棋盘 / 棋子 / 落点标记
   棋盘尺寸由 JS 算出 --cs（一格边长）写在 #xq-board 上，
   棋盘线用 SVG（viewBox 直接以「格」为单位），棋子用绝对定位的圆盘。
   ============================================================ */
#xq-panel { position:absolute; inset:0; z-index:4; }
#xq-panel.hidden { display:none; }

#xq-status {
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  font-family:var(--serif); font-size:15px; font-weight:800; color:var(--gold-lit);
  padding:7px 20px; border-radius:var(--r-pill); white-space:nowrap; z-index:5;
  background:rgba(7,42,23,.74); border:1px solid rgba(240,168,60,.20);
  text-shadow:0 1px 4px rgba(0,0,0,.6);
}

#xq-zone {
  position:absolute; inset:0; display:grid; place-items:center;
  padding:48px 12px 116px;
}
#xq-panel.editing #xq-zone { padding-bottom:246px; }

#xq-board {
  --cs: 48px;
  position:relative;
  width:calc(var(--cs) * 9.6); height:calc(var(--cs) * 10.6);
  border-radius:9px; touch-action:none;
  background:
    repeating-linear-gradient(92deg, rgba(120,86,40,.055) 0 3px, transparent 3px 12px),
    linear-gradient(158deg, #f0dcb4 0%, #e3c894 52%, #d3b279 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.52), inset 0 0 0 1px rgba(255,255,255,.45), inset 0 0 40px rgba(140,100,50,.18);
}
#xq-grid { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

/* 棋子：立体圆盘 */
.xq-disc {
  border-radius:50%; display:grid; place-items:center;
  font-family:var(--serif); font-weight:800; line-height:1; user-select:none;
  background:radial-gradient(circle at 34% 28%, #fffdf6, #f4e8ce 60%, #e0cca2);
  border:1px solid rgba(120,95,50,.55);
  box-shadow:0 2px 5px rgba(0,0,0,.34), inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 0 3.5px rgba(150,120,70,.3);
}
.xq-piece {
  position:absolute; width:calc(var(--cs) * .86); height:calc(var(--cs) * .86);
  font-size:calc(var(--cs) * .46);
  transform:translate(-50%,-50%); cursor:pointer;
  transition:left .2s cubic-bezier(.3,.8,.4,1), top .2s cubic-bezier(.3,.8,.4,1),
             box-shadow var(--t-fast) ease, transform var(--t-fast) ease;
}
.xq-piece.red { color:#b7301f; }
.xq-piece.black { color:#1c1917; }
.xq-piece:hover { box-shadow:0 4px 10px rgba(0,0,0,.4), 0 0 0 2px var(--gold-lit), inset 0 0 0 2px rgba(255,255,255,.55); }
.xq-piece.selected {
  transform:translate(-50%,-50%) scale(1.08);
  box-shadow:0 6px 14px rgba(0,0,0,.45), 0 0 0 3px var(--gold-lit), 0 0 18px 4px rgba(240,168,60,.55);
  z-index:3;
}
.xq-piece.movable { cursor:grab; }
.xq-piece.captured { animation:xq-fade .22s ease-in forwards; pointer-events:none; }
@keyframes xq-fade { to { opacity:0; transform:translate(-50%,-50%) scale(.4); } }
.xq-piece.placed { animation:xq-pop .18s ease-out; }
@keyframes xq-pop { from { transform:translate(-50%,-50%) scale(.3); opacity:.2; } }

/* 落点 / 最后一步标记 */
.xq-mark { position:absolute; transform:translate(-50%,-50%); pointer-events:none; }
.xq-mark.dot {
  width:calc(var(--cs) * .28); height:calc(var(--cs) * .28); border-radius:50%;
  background:rgba(30,90,55,.5); box-shadow:0 0 0 1px rgba(255,255,255,.4);
}
.xq-mark.cap {
  width:calc(var(--cs) * .94); height:calc(var(--cs) * .94); border-radius:50%;
  border:2.5px solid rgba(190,50,35,.72); box-shadow:0 0 8px rgba(190,50,35,.4);
}
.xq-mark.last {
  width:calc(var(--cs) * .9); height:calc(var(--cs) * .9); border-radius:50%;
  border:2px dashed rgba(60,110,70,.5);
}
.xq-mark.check {
  width:calc(var(--cs) * 1.0); height:calc(var(--cs) * 1.0); border-radius:50%;
  border:3px solid rgba(220,38,38,.85); animation:xq-pulse 1s ease-in-out infinite;
}
@keyframes xq-pulse { 50% { opacity:.35; } }

/* 棋子托盘（自定义摆子） */
#xq-tray {
  position:absolute; z-index:6; left:50%; transform:translateX(-50%); bottom:126px;
  display:flex; align-items:center; gap:5px; padding:6px 10px;
  border-radius:var(--r-lg); background:var(--panel); border:1px solid var(--line);
  box-shadow:var(--shadow-hud); max-width:calc(100% - 32px); flex-wrap:wrap; justify-content:center;
}
#xq-tray.hidden { display:none; }
#xq-tray .tray-side { display:flex; gap:4px; align-items:center; }
#xq-tray .tray-sep { width:1px; height:26px; background:var(--line); margin:0 3px; flex:none; }
.tray-item {
  width:38px; height:38px; font-size:20px; position:relative; cursor:pointer;
  border-radius:50%; display:grid; place-items:center; user-select:none; flex:none;
  background:radial-gradient(circle at 34% 28%, #fffdf6, #f4e8ce 60%, #e0cca2);
  border:1px solid rgba(120,95,50,.5);
  box-shadow:0 1px 3px rgba(0,0,0,.3), inset 0 0 0 3px rgba(150,120,70,.22);
}
.tray-item.red { color:#b7301f; }
.tray-item.black { color:#1c1917; }
.tray-item:hover { box-shadow:0 2px 7px rgba(0,0,0,.4), 0 0 0 2px var(--gold-lit); }
.tray-item[aria-pressed="true"] {
  box-shadow:0 0 0 3px var(--gold-lit), 0 0 16px rgba(240,168,60,.6);
  transform:scale(1.06);
}
.tray-hint { font-size:12.5px; color:var(--fg-muted); padding:0 4px; white-space:nowrap; }

/* 象棋右下工具（撤回 / 设置） */
#xq-toolbox {
  position:absolute; z-index:6; bottom:14px; right:calc(var(--rail) + 10px);
  display:flex; align-items:center; gap:4px; padding:5px;
  border-radius:var(--r-lg); background:var(--panel); border:1px solid var(--line);
  box-shadow:var(--shadow-hud);
}
#xq-set-wrap { position:relative; display:flex; }
#xq-set-toggle {
  display:inline-flex; align-items:center; gap:7px; min-height:40px; padding:0 15px;
  font-size:14px; color:var(--fg-dim); background:transparent;
  border:1px solid transparent; border-radius:10px;
}
#xq-set-toggle:hover { background:rgba(255,255,255,.09); color:#fff; }
#xq-set-toggle[aria-expanded="true"] { background:var(--gold); color:var(--on-gold); }
#xq-set-toggle svg { width:var(--icon); height:var(--icon); flex:none; }
#xq-set-panel {
  position:absolute; bottom:calc(100% + 12px); right:0; width:216px;
  display:flex; flex-direction:column; gap:9px; padding:11px;
  background:var(--panel-2); border:1px solid var(--line-2); border-radius:var(--r-md);
  box-shadow:0 12px 34px rgba(0,0,0,.55);
  transform-origin:bottom right; transition:transform var(--t) ease, opacity var(--t) ease;
}
#xq-set-panel.op-closed { transform:scale(.94) translateY(10px); opacity:0; pointer-events:none; }
.xq-group { display:flex; flex-direction:column; gap:5px; }
.xq-label { font-size:12px; font-weight:700; color:var(--fg-muted); letter-spacing:.06em; }
.seg {
  display:flex; gap:3px; padding:3px; background:var(--sunken);
  border:1px solid var(--line); border-radius:10px; box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
}
.seg-btn {
  flex:1; min-height:30px; padding:0 10px; font-size:13px; letter-spacing:.03em;
  color:var(--fg-muted); background:transparent; border-radius:7px;
}
.seg-btn:hover { background:rgba(255,255,255,.09); color:var(--fg); }
.seg-btn[aria-pressed="true"] {
  background:linear-gradient(180deg, var(--gold-lit), var(--gold)); color:var(--on-gold);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 2px 6px rgba(0,0,0,.45);
}
.seg-btn[aria-pressed="true"]:hover { color:var(--on-gold); }
#xq-set-panel .op-btn { min-height:34px; font-size:13.5px; }
.xq-start {
  justify-content:center; min-height:38px !important;
  background:linear-gradient(180deg, var(--jade), var(--jade-dark)) !important;
  color:#04240f !important; border-color:rgba(0,0,0,.3) !important; font-weight:700;
}
#xq-set-panel.hidden { display:none; }

/* 玩法切换：同一时间只显示一套界面 */
#game-container.mode-xq #player-1-area,
#game-container.mode-xq #player-2-area,
#game-container.mode-xq #bottom-cards-area,
#game-container.mode-xq #player-zone,
#game-container.mode-xq #toolbox { display:none; }
#game-container.mode-xq #xq-panel { display:block; }
#game-container.mode-xq #xq-toolbox { display:flex; }
#game-container:not(.mode-xq) #xq-panel,
#game-container:not(.mode-xq) #xq-toolbox { display:none; }

/* ============================================================
   自适应
   ============================================================ */
@media (max-width:1180px) {
  .btn-hud span, #op-toggle span, #counter-toggle span, #xq-set-toggle span { display:none; }
  .btn-hud { padding:0 12px; }
  #op-toggle, #counter-toggle, #xq-set-toggle { padding:0 12px; }
}
@media (max-width:860px) {
  :root { --rail:12px; --hud-clear:96px; }
  #counter-panel { width:172px; }
  #op-panel { width:176px; }
  #xq-set-panel { width:196px; }
  #cards-0 .card { margin-left:-26px; }
  #player-1-area { left:2%; } #player-2-area { right:2%; }
  #bottom-bar { left:calc(var(--rail) + 6px); bottom:10px; }
  #toolbox { right:calc(var(--rail) + 6px); bottom:10px; }
  #xq-toolbox { right:calc(var(--rail) + 6px); bottom:10px; }
  .btn-diff { padding:0 11px; }
  #status-text { font-size:15px; }
  #xq-status { font-size:13.5px; padding:6px 14px; top:8px; }
  #xq-zone { padding:40px 8px 104px; }
  #xq-panel.editing #xq-zone { padding-bottom:228px; }
  #xq-tray { bottom:112px; gap:3px; padding:5px 7px; }
  .tray-item { width:32px; height:32px; font-size:17px; }
  .tray-hint { display:none; }
  .game-btn { padding:0 10px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<!-- 图标符号表：统一 24 视框、2px 描边、线性风格 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0Z"/><circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="i-restart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/>
    </symbol>
    <symbol id="i-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/>
      <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/>
      <path d="m18 14 4 4-4 4"/>

<div id="game-container">
  <!-- 特殊牌型动效闪光层 -->
  <div id="fx-flash"></div>

  <!-- 电脑A（左上） -->
  <div id="player-1-area" class="seat">
    <div class="player-label" id="label-1">电脑A</div>
    <div class="ai-card-area" id="cards-1"></div>
    <div class="card-count" id="count-1">17张</div>
    <div class="play-area-ai" id="play-area-1"></div>
  </div>

  <!-- 电脑B（右上） -->
  <div id="player-2-area" class="seat">
    <div class="player-label" id="label-2">电脑B</div>
    <div class="ai-card-area" id="cards-2"></div>
    <div class="card-count" id="count-2">17张</div>
    <div class="play-area-ai" id="play-area-2"></div>
  </div>

  <!-- 底牌（地主三张） -->
  <div id="bottom-cards-area"></div>

  <!-- 玩家区（底部） -->
  <div id="player-zone">
    <div class="player-label" id="label-0">你</div>
    <div id="status-text" role="status" aria-live="polite">准备开始...</div>
    <div class="play-area-human" id="play-area-0"></div>
    <div id="action-row">
      <button class="btn-bid"    id="btn-bid"    style="display:none">抢地主</button>
      <button class="btn-no-bid" id="btn-no-bid" style="display:none">不抢</button>
      <button class="btn-hint"   id="btn-hint"   style="display:none">提示</button>
      <button class="btn-pass"   id="btn-pass"   style="display:none" disabled>不出</button>
      <button class="btn-play"   id="btn-play"   style="display:none" disabled>出牌</button>
    </div>
    <div class="player-cards" id="cards-0"></div>
  </div>

  <!-- 左下 HUD：玩法切换（上排） + 难度 / 操作（下排） -->
  <div id="bottom-bar">
    <div id="game-select" role="group" aria-label="玩法">
      <button class="game-btn" id="btn-game-ddz" data-game="ddz" aria-pressed="true">斗地主</button>
      <button class="game-btn" id="btn-game-xq"  data-game="xq"  aria-pressed="false">中国象棋</button>
    </div>
    <div id="hud-row">
      <div id="difficulty" role="group" aria-label="电脑难度">
        <button class="btn-diff" id="btn-diff-easy"   data-diff="easy"   aria-pressed="false">简单</button>
        <button class="btn-diff" id="btn-diff-normal" data-diff="normal" aria-pressed="true">普通</button>
        <button class="btn-diff" id="btn-diff-hard"   data-diff="hard"   aria-pressed="false">困难</button>
      </div>
      <div class="hud-sep" aria-hidden="true"></div>
      <button class="btn-hud" id="btn-toggle-ai"><svg aria-hidden="true"><use href="#i-eye"/></svg><span>查看电脑手牌</span></button>
      <button class="btn-hud" id="btn-restart"><svg aria-hidden="true"><use href="#i-restart"/></svg><span>重新开始</span></button>
    </div>
  </div>

  <!-- 右下工具：OP（固定刷牌型） + 记牌器 -->
  <div id="toolbox">
    <div id="op-wrap">
      <div id="op-panel" class="op-closed">
        <button class="op-btn" id="op-bomb"   data-accent="danger"><svg aria-hidden="true"><use href="#i-burst"/></svg>固定刷炸弹</button>
        <button class="op-btn" id="op-plane"  data-accent="danger"><svg aria-hidden="true"><use href="#i-plane"/></svg>固定刷飞机</button>
        <button class="op-btn" id="op-rocket" data-accent="danger"><svg aria-hidden="true"><use href="#i-crown"/></svg>固定刷王炸</button>
        <button class="op-btn" id="op-bad"   data-accent="danger"><svg aria-hidden="true"><use href="#i-shuffle"/></svg>烂牌开局</button>
        <button class="op-btn" id="op-good"  data-accent="danger"><svg aria-hidden="true"><use href="#i-sparkles"/></svg>好牌开局</button>
      </div>
      <button id="op-toggle" aria-expanded="false" aria-controls="op-panel" title="OP：固定刷出特殊牌型">
        <svg aria-hidden="true"><use href="#i-zap"/></svg><span id="op-toggle-label">OP</span>
      </button>
    </div>
    <div id="counter-wrap">
      <div id="counter-panel" class="counter-closed"></div>
      <button id="counter-toggle" aria-expanded="false" aria-controls="counter-panel" title="查看记牌器">
        <svg aria-hidden="true"><use href="#i-layers"/></svg><span id="counter-toggle-label">记牌器</span>
      </button>
    </div>
  </div>

  <!-- 中国象棋 -->
  <div id="xq-panel">
    <div id="xq-status" role="status" aria-live="polite">准备开始…</div>
    <div id="xq-zone">
      <div id="xq-board">
        <svg id="xq-grid" aria-hidden="true"></svg>
        <div id="xq-marks" aria-hidden="true"></div>
        <div id="xq-pieces"></div>
      </div>
    </div>
    <div id="xq-tray" class="hidden" role="group" aria-label="棋子托盘"></div>
  </div>

  <!-- 象棋右下工具：撤回 + 设置 -->
  <div id="xq-toolbox">
    <button class="btn-hud" id="xq-undo"><svg aria-hidden="true"><use href="#i-undo"/></svg><span>撤回</span></button>
    <div id="xq-set-wrap">
      <div id="xq-set-panel" class="op-closed">
        <div class="xq-group">
          <div class="xq-label">对局</div>
          <div class="seg" id="xq-mode">
            <button class="seg-btn" data-xq-mode="standard" aria-pressed="true">普通</button>
            <button class="seg-btn" data-xq-mode="custom" aria-pressed="false">自定义</button>
          </div>
        </div>
        <div class="xq-group">
          <div class="xq-label">我执</div>
          <div class="seg" id="xq-side">
            <button class="seg-btn" data-xq-side="red" aria-pressed="true">红方</button>
            <button class="seg-btn" data-xq-side="black" aria-pressed="false">黑方</button>
          </div>
        </div>
        <div class="xq-group" id="xq-turn-group">
          <div class="xq-label">先走</div>
          <div class="seg" id="xq-turn">
            <button class="seg-btn" data-xq-turn="red" aria-pressed="true">红</button>
            <button class="seg-btn" data-xq-turn="black" aria-pressed="false">黑</button>
          </div>
        </div>
        <div class="xq-group" id="xq-edit-tools">
          <div class="xq-label">摆子</div>
          <button class="op-btn" id="xq-clear">清空棋盘</button>
          <button class="op-btn" id="xq-standard">标准开局</button>
          <button class="op-btn" id="xq-sample">载入示例残局</button>
        </div>
        <button class="op-btn xq-start" id="xq-start">开始对局</button>
      </div>
      <button id="xq-set-toggle" aria-expanded="false" aria-controls="xq-set-panel" title="对局设置">
        <svg aria-hidden="true"><use href="#i-sliders"/></svg><span>设置</span>
      </button>
    </div>
  </div>

  <!-- Animation Overlay -->
  <div id="overlay" class="hidden">
    <div id="overlay-title"></div>
    <div id="overlay-content"></div>
    <div id="overlay-info"></div>
    <div id="overlay-buttons"></div>
  </div>

  <!-- Win Overlay -->
  <div id="win-overlay" class="hidden">
    <div id="win-text"></div>
    <div class="win-actions">
      <button class="btn-pass" id="btn-win-undo" style="display:none;font-size:16px;padding:0 28px;">撤回一步</button>
      <button class="btn-play" id="btn-win-restart" style="font-size:18px;padding:0 40px;">再来一局</button>
    </div>
  </div>
</div>

<script src="xiangqi.js"></script>
<script src="doudizhu.js"></script>
</body>
</html>
